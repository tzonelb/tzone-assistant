# Security response headers for T-ZONE.
# Install as /etc/nginx/snippets/tzone-security-headers.conf
#
# WHY THIS IS A SNIPPET AND NOT SIX LINES IN THE SERVER BLOCK
# -----------------------------------------------------------
# nginx does not merge `add_header` directives down into a location that
# declares one of its own. A location containing a single `add_header
# Cache-Control ...` silently loses every header set at the server level.
#
# Three locations in nginx.conf set their own header, and one of them is
# `location = /index.html` — the application document itself, the one response
# where Content-Security-Policy and X-Frame-Options actually matter. Before this
# snippet existed the SPA was served with no CSP at all while the configuration
# above it looked complete.
#
# So: include this at server level AND in every location that sets any header
# of its own. If you add such a location, add the include with it.

# Once a browser has seen this it refuses plain HTTP for this host. Only add the
# preload directive when the domain will stay on HTTPS permanently — preload
# entries are painful to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP for the React SPA. 'unsafe-inline' on style-src is required because the UI
# uses Emotion/MUI, which injects styles at runtime; scripts are restricted to
# the bundle served from this origin. connect-src allows the SPA's XHR and the
# EventSource stream, both same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
