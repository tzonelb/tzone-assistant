# Shared proxy settings for the T-ZONE API.
# Install as /etc/nginx/snippets/tzone-proxy.conf
#
# Note: this snippet is deliberately NOT used by the Server-Sent Events
# location in nginx.conf. That endpoint needs proxy_buffering off and a one
# hour read timeout, which would be wrong for every other route.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# $remote_addr, NOT $proxy_add_x_forwarded_for. The latter *appends* the real
# peer to whatever the client sent, and the application reads the first element
# of the header — so a client sending its own X-Forwarded-For chooses the
# address that gets recorded. That address is what the login lockout counts
# against and what every audit row stores, so appending made the throttle
# evadable by rotating one header and made the audit trail attacker-authored.
#
# This host is the only proxy in front of the application. If you ever put a
# CDN or load balancer in front of nginx, this line has to change with it —
# and so does client_ip() in backend/services/auth_service.py.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;

proxy_redirect off;
