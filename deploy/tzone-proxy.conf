# Shared proxy settings for the T-ZONE API.
# Install as /etc/nginx/snippets/tzone-proxy.conf
#
# Note: this snippet is deliberately NOT used by the Server-Sent Events
# location in nginx.conf. That endpoint needs proxy_buffering off and a one
# hour read timeout, which would be wrong for every other route.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;

proxy_redirect off;
