# T-ZONE Platform — nginx site configuration
#
# Install as /etc/nginx/sites-available/tzone and symlink into sites-enabled.
# Replace every occurrence of app.example.com with the real hostname.
#
# TLS is issued by certbot. Run certbot AFTER this file is in place and nginx
# has reloaded once, so the HTTP-01 challenge can be served from the ACME
# location below.

# Upstream is the uvicorn process from tzone-api.service. It is a single
# worker on purpose (see that unit file), so this block must stay a single
# server entry — adding more would imply a second process that must not exist.
upstream tzone_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
# The first line of defence, and the cheapest: a refusal here costs nginx a few
# microseconds, while the same request reaching the application costs a
# database open and, on the webhook path, up to seven write transactions.
#
# Keyed on $binary_remote_addr — the real peer, not a header. Anything derived
# from X-Forwarded-For would be chosen by the client and therefore useless as a
# limit. (The proxy snippet replaces that header for the same reason.)
#
# The application enforces its own ceilings independently. These are not a
# substitute for those: a deployment that never sees nginx must still be
# bounded, and a single attacker with many addresses walks past this while the
# application-side limits still hold.
#
# 10m of shared memory tracks roughly 160,000 addresses.

# Sign-in. Deliberately the tightest: this is where credentials are guessed,
# and each attempt costs a 310,000-iteration PBKDF2 round.
limit_req_zone $binary_remote_addr zone=tzone_login:10m rate=10r/m;

# Inbound webhooks. Meta and WhatsApp deliver in bursts, so the sustained rate
# is modest and the burst allowance is what carries a genuine batch through.
limit_req_zone $binary_remote_addr zone=tzone_webhook:10m rate=300r/m;

# Everything else an authenticated employee does. Generous — a busy inbox with
# the live stream open makes a lot of requests, and throttling real work would
# be a worse outcome than the traffic it prevents.
limit_req_zone $binary_remote_addr zone=tzone_api:10m rate=600r/m;

# Concurrent connections from one address. The live event stream holds one open
# per tab, so this has to allow several while still stopping an address from
# parking hundreds of sockets on a single-worker upstream.
limit_conn_zone $binary_remote_addr zone=tzone_conn:10m;

# 429, not 503. A rate limit is the client's problem to back off from, and
# `Retry-After` semantics only make sense on a 429 — the application already
# answers this way for the login throttle.
limit_req_status 429;
limit_conn_status 429;

# Log refusals at warning rather than error: they are expected traffic, and
# burying real errors under them is how an actual fault gets missed.
limit_req_log_level warn;
limit_conn_log_level warn;

# ---------------------------------------------------------------------------
# HTTP :80 — ACME challenge and redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # certbot writes its challenge files here; this must stay reachable over
    # plain HTTP or renewal fails silently and the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443 — the application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    # --- TLS (paths written by certbot) ------------------------------------
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TZONE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---------------------------------------------------
    # A location that declares any add_header of its own inherits none of
    # these, so the snippet is included again inside each such location below.
    # Read the comment at the top of it before changing either place.
    include /etc/nginx/snippets/tzone-security-headers.conf;

    # --- Body size ----------------------------------------------------------
    # Large enough for the media customers send through WhatsApp and Messenger,
    # small enough that a public webhook cannot be used to fill the disk.
    client_max_body_size 25m;
    client_body_timeout 60s;

    # --- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/tzone-access.log;
    error_log  /var/log/nginx/tzone-error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # SERVER-SENT EVENTS — this block must come before the /conversations one
    # -----------------------------------------------------------------------
    # The dashboard holds an EventSource open against this endpoint to receive
    # live inbox updates. With nginx's defaults it does not work:
    #
    #   * proxy_buffering on  -> nginx holds each event until its buffer fills,
    #                            so updates arrive minutes late or in bursts;
    #   * proxy_read_timeout 60s -> the stream is cut every minute and the
    #                            dashboard reconnects in a loop;
    #   * HTTP/1.0 upstream   -> no chunked streaming response at all.
    #
    # Location order matters: nginx picks the longest matching prefix, so this
    # more specific path wins over /conversations below. Do not "simplify" the
    # two blocks into one.
    location = /conversations/live/events {
        # One long-lived connection per open tab, so this is bounded by
        # connections rather than by request rate. Without the cap an address
        # could park hundreds of sockets on a single-worker upstream and starve
        # everyone else.
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # See the note in snippets/tzone-proxy.conf: replace, never append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stops any downstream buffering proxy from holding the stream too.
        add_header X-Accel-Buffering "no" always;

        # Required: the add_header above cancels the server-level ones.
        include /etc/nginx/snippets/tzone-security-headers.conf;
    }

    # --- API and webhooks ---------------------------------------------------

    # Both sign-in doors, held to the tightest zone. Listed before /api/ so the
    # longer prefix wins; nginx picks the most specific match, not the first.
    #
    # burst=5 with nodelay lets somebody who fat-fingered their password a few
    # times keep going at human speed, while the 10r/m sustained rate makes an
    # automated list attack pointless. The application's own account lock stops
    # a distributed attempt that spreads across addresses and never trips this.
    location = /api/auth/login {
        limit_req zone=tzone_login burst=5 nodelay;
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location = /api/platform/auth/login {
        limit_req zone=tzone_login burst=5 nodelay;
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /api/ {
        limit_req zone=tzone_api burst=120 nodelay;
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /conversations/ {
        limit_req zone=tzone_api burst=120 nodelay;
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    # Inbound Meta / WhatsApp webhooks. Signature verification happens in the
    # application — nginx cannot do it, because the secret depends on which
    # account the body names.
    #
    # What nginx can do is refuse volume before it costs anything. An
    # unauthenticated public endpoint that opens a database and writes several
    # rows per event is the most expensive thing on this server to flood, so it
    # gets both a rate and a body cap. The burst is large because Meta retries
    # in bursts after any outage of ours and dropping those loses real customer
    # messages.
    location /webhook/ {
        limit_req zone=tzone_webhook burst=100 nodelay;
        limit_conn tzone_conn 30;

        # Tighter than the 25m the rest of the site allows: that allowance is
        # for customer media, and no genuine webhook body approaches it. The
        # application enforces the same ceiling itself for deployments that
        # never see this proxy.
        client_max_body_size 5m;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /health {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
        access_log off;
    }

    # Remaining application routes that live outside /api.
    location /knowledge/ {
        limit_req zone=tzone_api burst=120 nodelay;
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /tickets/ {
        limit_req zone=tzone_api burst=120 nodelay;
        limit_conn tzone_conn 20;

        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    # --- Built frontend -----------------------------------------------------
    root /opt/tzone/frontend/dist;
    index index.html;

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Required: the add_header above cancels the server-level ones.
        include /etc/nginx/snippets/tzone-security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous bundle and requesting asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        # Required, and this is the response it matters most on: without the
        # include, the application document was served with no CSP and no
        # X-Frame-Options while the server block above looked complete.
        include /etc/nginx/snippets/tzone-security-headers.conf;
    }

    # Client-side routing: unknown paths are SPA routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The tzone-proxy.conf snippet included above ships as deploy/tzone-proxy.conf
# in this repository. Copy it to /etc/nginx/snippets/tzone-proxy.conf before
# reloading nginx, or every include above fails to open.
