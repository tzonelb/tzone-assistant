# T-ZONE Platform — nginx site configuration
#
# Install as /etc/nginx/sites-available/tzone and symlink into sites-enabled.
# Replace every occurrence of app.example.com with the real hostname.
#
# TLS is issued by certbot. Run certbot AFTER this file is in place and nginx
# has reloaded once, so the HTTP-01 challenge can be served from the ACME
# location below.

# Upstream is the uvicorn process from tzone-api.service. It is a single
# worker on purpose (see that unit file), so this block must stay a single
# server entry — adding more would imply a second process that must not exist.
upstream tzone_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP :80 — ACME challenge and redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # certbot writes its challenge files here; this must stay reachable over
    # plain HTTP or renewal fails silently and the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443 — the application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    # --- TLS (paths written by certbot) ------------------------------------
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TZONE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---------------------------------------------------
    # HSTS: once a browser has seen this it refuses plain HTTP for this host.
    # Only enable the preload directive when you are sure the domain will stay
    # on HTTPS permanently — preload entries are painful to undo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP for the React SPA. 'unsafe-inline' on style-src is required because
    # the UI uses Emotion/MUI, which injects styles at runtime; scripts are
    # restricted to the bundle served from this origin. connect-src allows the
    # SPA's XHR and the EventSource stream, both same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Body size ----------------------------------------------------------
    # Large enough for the media customers send through WhatsApp and Messenger,
    # small enough that a public webhook cannot be used to fill the disk.
    client_max_body_size 25m;
    client_body_timeout 60s;

    # --- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/tzone-access.log;
    error_log  /var/log/nginx/tzone-error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------------
    # SERVER-SENT EVENTS — this block must come before the /conversations one
    # -----------------------------------------------------------------------
    # The dashboard holds an EventSource open against this endpoint to receive
    # live inbox updates. With nginx's defaults it does not work:
    #
    #   * proxy_buffering on  -> nginx holds each event until its buffer fills,
    #                            so updates arrive minutes late or in bursts;
    #   * proxy_read_timeout 60s -> the stream is cut every minute and the
    #                            dashboard reconnects in a loop;
    #   * HTTP/1.0 upstream   -> no chunked streaming response at all.
    #
    # Location order matters: nginx picks the longest matching prefix, so this
    # more specific path wins over /conversations below. Do not "simplify" the
    # two blocks into one.
    location = /conversations/live/events {
        proxy_pass http://tzone_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stops any downstream buffering proxy from holding the stream too.
        add_header X-Accel-Buffering "no" always;
    }

    # --- API and webhooks ---------------------------------------------------
    location /api/ {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /conversations/ {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    # Inbound Meta / WhatsApp webhooks. Signature verification happens in the
    # application, so nothing is filtered here beyond the body size limit.
    location /webhook/ {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /health {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
        access_log off;
    }

    # Remaining application routes that live outside /api.
    location /knowledge/ {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    location /tickets/ {
        proxy_pass http://tzone_api;
        include /etc/nginx/snippets/tzone-proxy.conf;
    }

    # --- Built frontend -----------------------------------------------------
    root /opt/tzone/frontend/dist;
    index index.html;

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous bundle and requesting asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths are SPA routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The tzone-proxy.conf snippet included above ships as deploy/tzone-proxy.conf
# in this repository. Copy it to /etc/nginx/snippets/tzone-proxy.conf before
# reloading nginx, or every include above fails to open.
