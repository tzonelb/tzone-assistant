services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/app/database
      - uploads-data:/app/uploads
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads-data:
  caddy-data:
  caddy-config:
